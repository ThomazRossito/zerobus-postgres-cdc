# Debezium Server 3.7 · PostgreSQL -> Databricks Zerobus Ingest (sink nativo, rota gRPC)
# Os ${VAR} vêm do ambiente (o run.sh carrega o .env). Nenhum segredo fica neste arquivo.
#
# Três blocos: SINK (para onde vai), SOURCE (de onde vem) e FORMATO/SMT (que cara a linha tem ao chegar).
# O run.sh copia este arquivo para dist/debezium-server/config/ a cada partida: edite sempre este aqui.
# Qualquer chave pode ser trocada sem editar o arquivo, por variável de ambiente: nome em maiúsculas,
# "_" no lugar de "." (ex.: DEBEZIUM_SOURCE_SNAPSHOT_MODE=no_data). A variável vence o arquivo.

# Referências:
#  - Debezium Server, sink "Databricks Zerobus Ingest" (docs oficiais, seção debezium-server-databricks-zerobus-ingest-sink-configuration)
#  - Databricks, "Use the Zerobus Ingest connector" (docs.databricks.com/ingestion/zerobus-ingest)

# ---------- SINK: Zerobus ----------
# Autenticação por service principal (OAuth M2M): o sink troca client.id/secret por um token no
# workspace.url e abre o stream gRPC no endpoint do Zerobus. Permissões do SP: databricks/02_grants.sql
# (USE CATALOG, USE SCHEMA e SELECT + MODIFY direto em cada tabela).
debezium.sink.type=zerobus
debezium.sink.zerobus.endpoint=${ZEROBUS_SERVER_ENDPOINT}
debezium.sink.zerobus.workspace.url=${DATABRICKS_WORKSPACE_URL}
debezium.sink.zerobus.client.id=${DATABRICKS_CLIENT_ID}
debezium.sink.zerobus.client.secret=${DATABRICKS_CLIENT_SECRET}

# typed = cada evento vira uma linha com os tipos da tabela de destino (precisa do SMT unwrap abaixo)
# envelope = evento cru (key, value, operation, idempotency_key...). Mudar o modo exige outra tabela.
debezium.sink.zerobus.payload.mode=typed
debezium.sink.zerobus.record.format=json

# loga as métricas do sink a cada N lotes (também disponíveis via JMX). A linha "Zerobus sink metrics"
# traz r= (registros já confirmados pelo Zerobus) e maxFlushMs (o flush mais lento até agora).
debezium.sink.zerobus.metrics.log.interval=20

# O destino de cada evento é "<topic.prefix>.<schema>.<tabela>". Como topic.prefix = catálogo do Unity Catalog,
# retail.orders no Postgres vira <catalogo>.retail.orders no Databricks, sem roteamento extra.

# carga grande: lotes maiores = menos esperas pela confirmação do Zerobus
#   snapshot.fetch.size   linhas que o JDBC traz do Postgres por ida, durante o snapshot
#   max.batch.size        maior lote que o Debezium entrega ao sink de uma vez
#   max.queue.size        fila entre a leitura do Postgres e o sink (precisa ser maior que o lote)
#   max.inflight.records  registros já enviados ao Zerobus e ainda sem ack; no limite, o envio espera
# No CDC do dia a dia o lote não enche, e isso não atrasa nada: o Debezium entrega o que já estiver
# na fila, sem esperar completar max.batch.size.
debezium.source.snapshot.fetch.size=20480
debezium.source.max.batch.size=51200
debezium.source.max.queue.size=204800
debezium.sink.zerobus.max.inflight.records=100000

# ---------- SOURCE: PostgreSQL ----------
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector

# Offset = até onde o Debezium já entregou (o LSN do WAL). Sem Kafka, ele fica num arquivo local:
# data/offsets.dat é relativo à pasta de onde o Debezium roda, ou seja, dist/debezium-server/data/offsets.dat.
# Na próxima partida ele continua dali. Apagou o arquivo? Com snapshot.mode=initial, refaz o snapshot.
# flush.interval.ms=0: grava o offset a cada lote, sem esperar um intervalo.
# A entrega é "pelo menos uma vez": se o processo cair depois do ack e antes de gravar o offset, o lote
# volta. A bronze pode ter duplicata; a silver resolve com SEQUENCE BY __lsn (databricks/03_pipeline_silver.sql).
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0

# usuário dbz: só LOGIN, REPLICATION e SELECT no schema retail (postgres/01_replication.sql e 02_schema_retail.sql)
debezium.source.database.hostname=${PG_HOST}
debezium.source.database.port=${PG_PORT}
debezium.source.database.user=${PG_USER}
debezium.source.database.password=${PG_PASSWORD}
debezium.source.database.dbname=${PG_DBNAME}

# pgoutput: o decodificador lógico que já vem no Postgres (10+). Não tem plugin para instalar.
debezium.source.plugin.name=pgoutput

# Slot de replicação: o Debezium cria na primeira partida, se ainda não existir, e confirma nele até onde leu.
# Enquanto o slot existir, o Postgres guarda o WAL dali para frente, mesmo com o Debezium parado:
# slot esquecido enche o disco.  Ver:  SELECT slot_name, active, restart_lsn FROM pg_replication_slots;
# Acabou a demo:                       SELECT pg_drop_replication_slot('zerobus_demo');
# Outro workspace lendo o mesmo Postgres precisa de outro slot (DEBEZIUM_SOURCE_SLOT_NAME) e de outro offset.
debezium.source.slot.name=zerobus_demo

# Publication: quais tabelas entram no fluxo. Quem cria é o postgres/02_schema_retail.sql.
# disabled: o Debezium não tenta criar (o dbz nem teria permissão) e para com erro se ela não existir.
debezium.source.publication.name=zerobus_pub
debezium.source.publication.autocreate.mode=disabled

# topic.prefix vira a 1a parte do nome da tabela no Unity Catalog
debezium.source.topic.prefix=${UC_CATALOG}
debezium.source.schema.include.list=retail
debezium.source.table.include.list=retail.orders,retail.inventory
# a lista precisa bater com a publication: o streaming só recebe mudanças das tabelas que estão nela

# initial = snapshot das tabelas e depois streaming. Para só streaming: no_data
# As linhas do snapshot chegam na bronze com __op='r'. Se já existe offset, o initial não refaz o snapshot.
debezium.source.snapshot.mode=initial

# sem tombstone depois do delete (o unwrap em modo rewrite já representa o delete).
# Tombstone é a mensagem nula que o Kafka usa para compactar tópico; aqui não tem Kafka nem tópico.
debezium.source.tombstones.on.delete=false

# padrões explícitos, porque definem o tipo no Delta: precise -> DECIMAL; adaptive -> timestamp em micros
# numeric(10,2) do Postgres chega como DECIMAL(10,2) exato; em double, valor de dinheiro perde a exatidão.
debezium.source.decimal.handling.mode=precise
debezium.source.time.precision.mode=adaptive

# ---------- FORMATO: JSON plano, sem schema embutido ----------
# schemas.enable=false tira o bloco "schema" que o Kafka Connect põe em cada mensagem.
# Quem define o schema aqui é a tabela Delta.
debezium.format.key=json
debezium.format.key.schemas.enable=false
debezium.format.value=json
debezium.format.value.schemas.enable=false

# ---------- SMT: achata o envelope (before/after/op) numa linha ----------
# Resultado: colunas da tabela + __op, __ts_ms, __source_ts_ms, __lsn, __deleted
debezium.transforms=unwrap
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.delete.tombstone.handling.mode=rewrite
debezium.transforms.unwrap.add.fields=op,ts_ms,source.ts_ms,lsn
# rewrite: o delete vira uma linha com __op='d' e __deleted='true'. Com REPLICA IDENTITY FULL no Postgres
#   (postgres/02_schema_retail.sql), essa linha traz todas as colunas, e não só a chave.
# add.fields: __op (c, u, d ou r), __ts_ms (quando o Debezium processou), __source_ts_ms (commit no Postgres)
#   e __lsn (posição no WAL: é a ordem dos eventos).
# Contrato de schema: todo campo que sai daqui precisa existir na tabela Delta (databricks/01_tables.sql).
#   Coluna nova no Postgres sem a coluna na bronze: o Zerobus rejeita o registro (demo no 05_demo_video.sql).

# ---------- LOG ----------
quarkus.log.level=INFO
quarkus.log.console.json=false
quarkus.log.category."io.debezium.server.databricks".level=INFO

# o SDK do Zerobus loga "All records have been flushed" a cada lote; WARN deixa só avisos e erros
quarkus.log.category."com.databricks.zerobus".level=WARN
